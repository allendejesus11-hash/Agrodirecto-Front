<!-- encabezado -->
<header class="publicar-encabezado">
  <a routerLink="/inicio-productor" class="flecha-volver">
    <img src="assets/images/flecha_retroceso2.png" />
  </a>
  <h1 class="publicar-titulo">Publicar carga</h1>
</header>

<main class="publicar-contenido">
  <h2 class="publicar-subtitulo">Nueva publicación</h2>

  <form [formGroup]="publicarForm" (ngSubmit)="publicar()" ngNativeValidate>
    <!-- tipo de cultivo -->
    <div class="campo-formulario">
      <label class="campo-label">Tipo de cultivo:</label>
      <div class="opciones-fila">
            @for (opcion of cultivos; track opcion.valor) {
              <button
                type="button"
                class="btn-opcion"
                [class.activo]="cultivo() === opcion.valor"
                (click)="cultivo.set(opcion.valor)"
              >
                {{ opcion.texto }}
              </button>
            }
          </div>
    </div>

    <!-- peso estimado -->
    <div class="campo-formulario">
      <label for="peso" class="campo-label"
        >Peso estimado (kg) MAX 50T:</label
      >
      <input type="number" id="peso" class="campo-input" min="0" formControlName="peso" />
      <p class="campo-error" [class.visible]="errorPeso()">
        Ingrese un peso válido mayor a 0
      </p>
    </div>

    <!-- tipo -->
    <div class="campo-formulario">
      <label class="campo-label">Tipo:</label>
      <div class="opciones-fila">
            @for (opcion of tipos; track opcion.valor) {
              <button
                type="button"
                class="btn-opcion"
                [class.activo]="tipo() === opcion.valor"
                (click)="tipo.set(opcion.valor)"
              >
                {{ opcion.texto }}
              </button>
            }
          </div>
    </div>

    <!-- direccion destino -->
    <div class="campo-formulario">
      <label for="destino" class="campo-label"
        >Dirección/Ciudad de Destino:</label
      >
      <input type="text" id="destino" class="campo-input" formControlName="destino" />
    </div>

    <!-- tarifa -->
    <div class="campo-formulario">
      <label for="tarifa" class="campo-label"
        >Tarifa/Presupuesto propuesto (S/):</label
      >
      <input type="number" id="tarifa" class="campo-input" min="0" formControlName="tarifa" />
      <p class="campo-error" [class.visible]="errorTarifa()">
        Ingrese una tarifa válida mayor a 0
      </p>
    </div>

    <!-- punto de acopio -->
    <div class="campo-formulario">
      <label class="campo-label campo-label-centro"
        >Punto de acopio (GPS):</label
      >
      <div class="mapa-contenedor">
        <img src="assets/images/mapa.png" />
      </div>
    </div>

    <!-- fecha de recojo -->
    <div class="campo-formulario">
      <label for="fecha" class="campo-label">Fecha de recojo:</label>
      <input type="date" id="fecha" class="campo-input" formControlName="fecha" />
    </div>

    <!-- marcar como urgente -->
    <div class="campo-urgente" (click)="alternarUrgente()">
      <span class="checkbox-urgente" [class.marcado]="urgente()"></span>
      <span>Marcar como urgente</span>
    </div>

    <!-- acciones -->
    <div class="publicar-acciones">
      <button type="submit" class="btn-publicar">Publicar carga</button>
      <button type="button" class="btn-cancelar" (click)="modalCancelar.set(true)">
        Cancelar carga
      </button>
    </div>
  </form>

  <!-- modal de confirmacion -->
  <div class="modal-overlay" [class.visible]="modalCancelar()">
    <div class="modal-caja">
      <p class="modal-pregunta">
        ¿Estás seguro de que deseas cancelar esta carga?
      </p>
      <div class="modal-botones">
        <button type="button" class="modal-btn-no" (click)="modalCancelar.set(false)">
          No
        </button>
        <a routerLink="/inicio-productor" class="modal-btn-si">Sí</a>
      </div>
    </div>
  </div>
</main>
