<!-- Pantalla de registro de productor -->
<section class="registro-pantalla">
  <a routerLink="/inicio-sesion" class="flecha-volver">
    <img src="assets/images/flecha_retroceso.png" alt="Volver" />
  </a>

  <div class="registro-contenedor">
    <h1 class="registro-titulo">Registrar productor</h1>

    <div class="registro-tipo-usuario">
      <a class="btn-tipo activo">Productor</a>
      <a routerLink="/crear-transportista" class="btn-tipo">Transportista</a>
    </div>

    <form class="registro-formulario" [formGroup]="registroForm" (ngSubmit)="continuar()" ngNativeValidate>
      <div class="campo-registro">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" formControlName="nombre" />
      </div>

      <div class="campo-registro">
        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" formControlName="dni" maxlength="8" />
        <p class="campo-error" [class.visible]="errorDni()">
          Ingrese un DNI válido de 8 dígitos
        </p>
      </div>

      <div class="campo-registro">
        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" formControlName="correo" />
      </div>

      <div class="campo-registro">
        <label for="distrito">Distrito:</label>
        <input type="text" id="distrito" name="distrito" formControlName="distrito" />
      </div>

      <div class="campo-registro">
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" formControlName="contrasena" />
        <p class="campo-error" [class.visible]="errorContrasena()">
          La contraseña debe tener al menos 6 caracteres
        </p>
      </div>

      <button type="submit" class="btn-continuar">Continuar</button>
    </form>
  </div>
</section>
