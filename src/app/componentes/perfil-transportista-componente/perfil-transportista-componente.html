<!-- encabezado -->
<header class="perfil-encabezado">
  <h1 class="perfil-titulo">Perfil transportista</h1>
  <a routerLink="/perfil-transportista2" class="btn-menu">
    <img src="assets/images/barras_menu.png" />
  </a>
</header>

<main class="perfil-contenido">
  <!-- datos principales -->
  <section class="seccion-datos">
    <img src="assets/images/persona_real1.png" class="perfil-foto" />

    <div class="datos-info">
      <h2 class="perfil-nombre">Miguel Asto Ramos</h2>

      <div class="datos-fila">
        <span class="perfil-verificado">✓ Verificado</span>
        <div class="perfil-calificacion">
          <span class="calificacion-numero">4.2</span>
          <span class="calificacion-estrellas">★★★★☆</span>
        </div>
      </div>

      <p class="perfil-viajes">38 viajes</p>
    </div>
  </section>

  <!-- datos del vehiculo -->
  <div class="tarjeta-datos">
    <p class="dato-linea">RUC: 20123456789</p>
    <p class="dato-linea">Placa: A62BX-5T · Camión 10 t</p>
    <p class="dato-linea">Licencia: A-IIb vigente</p>
  </div>

  <!-- comentarios -->
  <section class="seccion-comentarios">
    <h2 class="comentarios-titulo">Comentarios recientes</h2>

    <div class="tarjeta-comentario">
      <img src="assets/images/persona_real2.png" class="comentario-foto" />
      <div class="comentario-info">
        <span class="comentario-estrellas">★★★★★</span>
        <p class="comentario-texto">"Puntual y cuidadoso con la carga."</p>
      </div>
    </div>

    <div class="tarjeta-comentario">
      <img src="assets/images/persona_real3.png" class="comentario-foto" />
      <div class="comentario-info">
        <span class="comentario-estrellas">★★★☆☆</span>
        <p class="comentario-texto">"Llegó tarde pero avisó con tiempo."</p>
      </div>
    </div>
  </section>

  <!-- reportar abuso -->
  <button class="btn-reportar">Reportar abuso</button>
</main>

<!-- barra de navegacion inferior -->
<nav class="nav-inferior">
  <a routerLink="/inicio-transportista" class="nav-item">
    <img src="assets/images/inicio.png" />
    <span>Inicio</span>
  </a>
  <a routerLink="/lotes-transportista" class="nav-item">
    <img src="assets/images/camion.png" />
    <span>Lotes</span>
  </a>
  <a routerLink="/rutas-transportista" class="nav-item">
    <img src="assets/images/pista.png" />
    <span>Rutas</span>
  </a>
  <a routerLink="/perfil-transportista" class="nav-item activo">
    <img src="assets/images/persona.png" />
    <span>Perfil</span>
  </a>
</nav>
