<!-- encabezado -->
<header class="logros-encabezado">
  <a routerLink="/informacion-productor" class="flecha-volver">
    <img src="assets/images/flecha_retroceso2.png" />
  </a>
  <h1 class="logros-titulo-pagina">Ahorro por temporada</h1>
</header>

<main class="logros-contenido">
  <!-- resumen de ahorro -->
  <section class="seccion-resumen-ahorro">
    <h2 class="resumen-subtitulo">Resumen de ahorro:</h2>

    <div class="tarjeta-resumen">
      <p class="resumen-monto">S/420</p>
      <p class="resumen-detalle">Ahorro 2025</p>
    </div>

    <div class="tarjeta-resumen">
      <p class="resumen-monto">S/ 140</p>
      <p class="resumen-detalle">Este mes</p>
    </div>
  </section>

  <!-- ahorro por mes -->
  <section class="seccion-grafico">
    <h2 class="grafico-subtitulo">Ahorro por mes:</h2>
    <img
      src="assets/images/grafico_logros.png"
      class="grafico-mensual"
    />
  </section>

  <div class="separador"></div>

  <!-- mis logros -->
  <section class="seccion-logros">
    <h2 class="logros-subtitulo">Mis logros:</h2>

    <div class="lista-logros">
      <div class="logro-item">
        <img src="assets/images/trofeo.png" class="logro-icono" />
        <div class="logro-texto">
          <p class="logro-nombre">Primer envío consolidado</p>
          <p class="logro-detalle">Logro desbloqueado-Ene 2025</p>
        </div>
        <span class="badge-obtenido">Obtenido</span>
      </div>

      <div class="logro-item">
        <img src="assets/images/estrella.png" class="logro-icono" />
        <div class="logro-texto">
          <p class="logro-nombre">Ahorrador del mes</p>
          <p class="logro-detalle">+S/140 en Mayo</p>
        </div>
        <span class="badge-obtenido">Obtenido</span>
      </div>

      <div class="logro-item sin-borde">
        <img src="assets/images/candado.png" class="logro-icono" />
        <div class="logro-texto">
          <p class="logro-nombre">Productor del año</p>
          <p class="logro-detalle">Requiere S/1,000 de ahorro anual</p>
        </div>
      </div>
    </div>
  </section>
</main>
