<!-- encabezado -->
<header class="lista-encabezado">
  <h1 class="lista-titulo">Lista de cargas</h1>
</header>

<main class="lista-contenido">
  <!-- cargas -->
  <section class="seccion-cargas">
        @for (carga of cargas; track carga) {
          <div class="carga-item" [class.activo]="seleccionada() === carga" (click)="seleccionada.set(carga)">
            <div class="carga-icono-contenedor">
              <img src="assets/images/caja2.png" class="carga-icono" />
            </div>
            <div class="carga-info">
              <p>Producto: ----------------</p>
              <p>Mercado: ------------</p>
              <p>Hora de entrega: ------------</p>
            </div>
          </div>
        }
      </section>

  <!-- datos del comprador -->
  <section class="seccion-comprador">
    <h2 class="comprador-titulo">Datos del comprador:</h2>

    <input type="text" id="nombre-comprador" class="campo-input" placeholder="Nombre del comprador" [formControl]="nombreComprador" />
    <input type="text" id="dni-comprador" class="campo-input" placeholder="DNI/RUC" [formControl]="dniComprador" />
    <p class="campo-error" [class.visible]="errorDniComprador()">
      Ingrese un DNI (8 dígitos) o RUC (11 dígitos) válido
    </p>
  </section>

  <!-- firma digital -->
  <section class="seccion-firma">
    <h2 class="firma-titulo">Firma digital</h2>
    <div class="firma-area">
      <span>Área de firma</span>
    </div>
  </section>

  <!-- acciones -->
  <div class="lista-acciones">
    <button type="button" class="btn-limpiar" (click)="limpiar()">
      Limpiar
    </button>
    <a href="/inicio-productor" class="btn-confirmar" (click)="confirmarEntrega($event)">
      Confirma entrega
    </a>
  </div>
</main>

<!-- barra de navegacion inferior -->
<nav class="nav-inferior">
  <a routerLink="/inicio-productor" class="nav-item">
    <img src="assets/images/inicio.png" />
    <span>Inicio</span>
  </a>
  <a routerLink="/cargas-productor" class="nav-item activo">
    <img src="assets/images/caja2.png" />
    <span>Cargas</span>
  </a>
  <a routerLink="/precios-productor" class="nav-item">
    <img src="assets/images/grafico_barras.png" />
    <span>Precios</span>
  </a>
  <a routerLink="/informacion-productor" class="nav-item">
    <img src="assets/images/persona.png" />
    <span>Información</span>
  </a>
</nav>
